services:
  api:
    build:
      context: ./apps/api
    container_name: ai-job-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+psycopg://jobintel:jobintel@db:5432/jobintel
      # Job Discovery source/trigger config - unset by default (${VAR:-}
      # keeps it that way unless the operator's shell/.env sets it), so
      # POST /internal/job-discovery/run stays a hard 503 until an
      # operator deliberately configures a board. See
      # services/job_discovery/README.md.
      JOB_DISCOVERY_GREENHOUSE_BOARD_TOKEN: ${JOB_DISCOVERY_GREENHOUSE_BOARD_TOKEN:-}
      JOB_DISCOVERY_GREENHOUSE_COMPANY_NAME: ${JOB_DISCOVERY_GREENHOUSE_COMPANY_NAME:-}
      JOB_DISCOVERY_TRIGGER_TOKEN: ${JOB_DISCOVERY_TRIGGER_TOKEN:-}
      # TheirStack provider (AJI-021) - disabled unless THEIRSTACK_ENABLED
      # is explicitly set. THEIRSTACK_API_KEY is a server-side secret;
      # never surfaced outside this container. See
      # services/job_discovery/README.md.
      THEIRSTACK_ENABLED: ${THEIRSTACK_ENABLED:-false}
      THEIRSTACK_API_KEY: ${THEIRSTACK_API_KEY:-}
      THEIRSTACK_MAX_RESULTS: ${THEIRSTACK_MAX_RESULTS:-50}
      THEIRSTACK_PAGE_SIZE: ${THEIRSTACK_PAGE_SIZE:-25}
      THEIRSTACK_TIMEOUT_SECONDS: ${THEIRSTACK_TIMEOUT_SECONDS:-15}
      THEIRSTACK_MAX_RETRIES: ${THEIRSTACK_MAX_RETRIES:-2}
      THEIRSTACK_POSTED_AT_MAX_AGE_DAYS: ${THEIRSTACK_POSTED_AT_MAX_AGE_DAYS:-7}
      THEIRSTACK_JOB_TITLES: ${THEIRSTACK_JOB_TITLES:-}
      THEIRSTACK_COUNTRY_CODES: ${THEIRSTACK_COUNTRY_CODES:-US}
    depends_on:
      db:
        condition: service_healthy

  # Calls the existing POST /internal/job-discovery/run on an interval -
  # see deploy/discovery-scheduler/run_scheduler.sh for what it does and
  # why it's a plain loop rather than cron/a task queue. It shares the
  # same JOB_DISCOVERY_TRIGGER_TOKEN as `api` so the request it sends is
  # authenticated exactly like any other caller of that endpoint - this
  # is not a second discovery execution path.
  discovery-scheduler:
    build:
      context: ./deploy/discovery-scheduler
    container_name: ai-job-intelligence-discovery-scheduler
    depends_on:
      - api
    environment:
      DISCOVERY_API_URL: http://api:8000
      JOB_DISCOVERY_TRIGGER_TOKEN: ${JOB_DISCOVERY_TRIGGER_TOKEN:-}
      # Initial operational default (every 6 hours) - not a product
      # requirement. Change per environment without rebuilding the image.
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-21600}
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: ai-job-intelligence-db
    environment:
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: jobintel
      POSTGRES_DB: jobintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d jobintel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
